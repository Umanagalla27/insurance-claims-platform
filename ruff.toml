# ============================================================
# ruff.toml — Linter + Formatter configuration
# ============================================================
# Ruff replaces: flake8, black, isort, pyupgrade, pydocstyle
# One tool for all code quality checks.
#
# WHY THIS MATTERS IN A COMPANY:
#   Code style debates waste review time. We configure once,
#   enforce everywhere (pre-commit + CI). No more "you should use
#   double quotes" comments in PRs.
# ============================================================

# Target Python version
target-version = "py312"

# Line length — 88 is Black's default; most companies use 88-100
line-length = 88

# Files/folders to never lint
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    "ml/notebooks",        # Notebooks have unusual code patterns — skip
    "infrastructure",      # Terraform/YAML files — ruff doesn't touch these
]

[lint]
# Rules to enable:
# E, W = pycodestyle errors/warnings
# F    = Pyflakes (unused imports, undefined names — these WILL be bugs in prod)
# I    = isort (import ordering — keeps imports clean)
# UP   = pyupgrade (use modern Python syntax)
# B    = flake8-bugbear (common bug patterns)
# C4   = flake8-comprehensions (better list/dict comprehensions)
# SIM  = flake8-simplify (simplifiable code)
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

# Rules to ignore (with reasons — always document WHY you ignore):
ignore = [
    "E501",   # Line too long — ruff format handles this, don't double-report
    "B008",   # Do not perform function calls in default args — FastAPI uses this pattern (Depends())
    "SIM108", # Ternary operator — sometimes if/else is more readable
]

# Allow unused imports in __init__.py (they're re-exports, not mistakes)
[lint.per-file-ignores]
"__init__.py" = ["F401"]  # F401 = imported but unused
"*/tests/*.py" = ["S101"] # S101 = use of assert (fine in tests, bad in production)

[lint.isort]
# Group imports: stdlib → third-party → local
# This is the standard Python import ordering
known-first-party = ["etl", "api", "mock_api", "ml", "rag_chatbot"]

[format]
# Use double quotes (Python community standard)
quote-style = "double"
# Add trailing comma after function arguments (makes diffs cleaner)
skip-magic-trailing-comma = false
# Indent with spaces (always, never tabs)
indent-style = "space"
