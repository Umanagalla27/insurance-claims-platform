# ============================================================
# pytest.ini — Pytest configuration
# ============================================================
# Tells pytest HOW to run tests for this project.
# Without this, you'd need to pass flags on every command.
# Real companies always have this file — it makes CI consistent.
# ============================================================

[pytest]
# Default test discovery path
testpaths = 
    mock_api/tests
    etl/tests
    ml/tests
    rag_chatbot/tests
    api/tests

# Always show detailed output
addopts = 
    -v
    --tb=short
    --strict-markers

# Custom markers — prevents "PytestUnknownMarkWarning" and
# lets team understand what each marker means at a glance
markers =
    unit: Unit tests (fast, no I/O, no DB)
    integration: Integration tests (needs DB or external service)
    slow: Tests that take > 5 seconds
    smoke: Quick sanity checks (run before full test suite)

# Root pythonpath for test resolution
pythonpath = .

# Async test mode (needed for FastAPI async endpoint tests)
asyncio_mode = auto

# Minimum version warning
minversion = 9.0
